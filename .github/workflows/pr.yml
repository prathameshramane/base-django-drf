name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate .env for Tests
        run: |
          python generate_env.py
          # Override settings so tests don't fail without external postgres/redis instances
          echo "USE_POSTGRES=False" >> .env
          echo "USE_REDIS=False" >> .env
          echo "USE_CELERY=False" >> .env

      - name: Run Tests
        run: |
          python manage.py test

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Docker Build
        run: |
          docker build -t test-build .
